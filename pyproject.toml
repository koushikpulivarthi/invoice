[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "1.1.0"
description = "Rule-based invoice classifier (PDF, Word, text, images) that exports sector-specific fields to Excel"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "rapidocr_onnxruntime>=1.2.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
